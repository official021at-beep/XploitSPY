android {
    compileSdkVersion 34
    defaultConfig {
        targetSdkVersion 34
        minSdkVersion 21
        applicationId "com.android.tool.utility"
    }
    signingConfigs {
        release {
            storeFile file('utility-store.jks')
            storePassword 'androidpass'
            keyAlias 'utilitykey'
            keyPassword 'androidpass'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
    }
}
